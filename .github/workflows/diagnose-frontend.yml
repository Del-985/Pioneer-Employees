name: Diagnose Employee Frontend

on:
  workflow_run:
    workflows:
      - Deploy Pioneer Employees
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install application and browser driver
        run: |
          npm install
          npm install --no-save playwright
      - name: Build application
        run: npm run build
      - name: Inspect GitHub Pages HTTPS status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/pages --jq '{custom_domain: .cname, https_enforced: .https_enforced, certificate: .https_certificate.state}' || true
      - name: Inspect production and local application in Chrome
        run: node .github/scripts/diagnose-frontend.cjs
      - name: Smoke test login when Safari blocks the session cookie
        run: node .github/scripts/smoke-cookieblocked-login.cjs
      - name: Smoke test employee v0.2 actions with mocked staff session
        run: node .github/scripts/smoke-employee-field.cjs
      - name: Smoke test photo uploads and gallery
        run: node .github/scripts/smoke-field-photos.cjs
      - name: Smoke test employee time clock and breaks
        run: node .github/scripts/smoke-timekeeping.cjs
